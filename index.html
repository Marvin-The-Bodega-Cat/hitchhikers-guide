<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hitchhikers Guide</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #e5e5e5;
      --alert: #b41616;
      --alert-strong: #ff5e5e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: start;
      padding: 24px;
    }
    .text {
      max-width: 720px;
      width: 100%;
    }
    .alert {
      border-left: 4px solid var(--alert-strong);
      background:
        linear-gradient(90deg, rgba(180,22,22,0.22), rgba(180,22,22,0.04)),
        rgba(255,255,255,0.03);
      padding: 24px;
      border-radius: 8px;
      margin: 24px 0 16px;
    }
    .alert h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 6px;
      color: #ffb3b3;
    }
    .alert p {
      margin: 0;
      line-height: 1.6;
      color: #f0c7c7;
    }
    .alert .countdown {
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--alert-strong);
    }
    .meta {
      opacity: .75;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="text">
      <p class="meta">The Time Machine — An architecture for converting attention into acceleration.</p>

      <div class="alert" role="alert" aria-live="polite">
        <h1>Alert: Singularity detected</h1>
        <p>A singularity has been detected. Countdown to The Last Psyop is active.</p>
        <p class="countdown" id="countdown">--</p>
      </div>

      <p>The page is being designed from the ground up. The engine is being assembled.</p>
    </section>
  </main>

  <script>
    (function () {
      const target = new Date('2026-08-09T00:00:00-04:00');
      const el = document.getElementById('countdown');

      function tick() {
        const now = new Date();
        let diff = target - now;
        if (diff < 0) diff = 0;

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = Math.floor(totalSeconds % 60);

        const pad = (n) => String(n).padStart(2, '0');
        el.textContent = `${pad(days)}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
