<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hitchhiker's Guide to the Future</title>
  <meta name="description" content="A big friendly guide for people trying not to panic about the future." />
  <script src="https://cdn.usefathom.com/script.js" data-site="LLFJJYXQ" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --space: #03040a;
      --ink: #17100a;
      --paper: #f7c94a;
      --paper-light: #ffe58d;
      --paper-dark: #c48716;
      --red: #ec3434;
      --blue: #69c7ff;
      --white: #fff7df;
      --muted: rgba(255, 247, 223, 0.72);
      --shadow: rgba(0, 0, 0, 0.58);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: var(--space); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 72px);
      color: var(--white);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(105, 199, 255, 0.18), transparent 24rem),
        radial-gradient(circle at 82% 14%, rgba(236, 52, 52, 0.14), transparent 22rem),
        radial-gradient(circle at 50% 130%, rgba(247, 201, 74, 0.16), transparent 36rem),
        linear-gradient(180deg, #050714 0%, #03040a 62%, #010104 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.72) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255,255,255,0.36) 0 1px, transparent 1.3px);
      background-size: 91px 91px, 137px 137px;
      background-position: 12px 20px, 40px 73px;
      opacity: 0.22;
      mask-image: linear-gradient(180deg, #000, transparent 88%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(280px, 1fr);
      gap: clamp(30px, 6vw, 76px);
      align-items: center;
    }

    .book-wrap { perspective: 1400px; }

    .book {
      position: relative;
      aspect-ratio: 0.68;
      width: min(440px, 88vw);
      margin-inline: auto;
      padding: clamp(26px, 5vw, 44px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--ink);
      background:
        linear-gradient(100deg, rgba(255,255,255,0.36), transparent 24%),
        radial-gradient(circle at 70% 28%, rgba(255,255,255,0.34), transparent 11rem),
        linear-gradient(145deg, var(--paper-light), var(--paper) 44%, var(--paper-dark));
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 12px 20px 20px 12px;
      box-shadow:
        32px 34px 70px var(--shadow),
        inset 16px 0 24px rgba(101, 57, 5, 0.18),
        inset -10px 0 18px rgba(255, 255, 255, 0.18);
      transform: rotateY(-11deg) rotateZ(-1.2deg);
    }

    .book::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42px;
      border-radius: 12px 0 0 12px;
      background: linear-gradient(90deg, rgba(67, 34, 4, 0.34), rgba(67, 34, 4, 0.05), transparent);
    }

    .book::after {
      content: "";
      position: absolute;
      right: -16px;
      top: 16px;
      bottom: 16px;
      width: 18px;
      border-radius: 0 16px 16px 0;
      background: repeating-linear-gradient(180deg, #f3e3bb 0 5px, #d6bc80 5px 7px);
      box-shadow: 18px 18px 44px rgba(0,0,0,0.34);
      transform: skewY(2deg);
    }

    .panic {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--red);
      font-size: clamp(52px, 9vw, 92px);
      line-height: 0.84;
      letter-spacing: -0.08em;
      font-weight: 1000;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px rgba(255,255,255,0.30);
    }

    .glyph {
      place-self: center;
      width: min(230px, 54%);
      aspect-ratio: 1;
      border: 12px solid rgba(23, 16, 10, 0.86);
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 12px rgba(236, 52, 52, 0.74), 0 16px 28px rgba(0,0,0,0.15);
    }

    .glyph span {
      width: 48%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--ink);
      box-shadow:
        58px 0 0 -19px var(--ink),
        -58px 0 0 -19px var(--ink),
        0 62px 0 -24px var(--ink),
        0 -62px 0 -24px var(--ink);
    }

    .future {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(23px, 4.5vw, 42px);
      line-height: 0.94;
      letter-spacing: -0.035em;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .copy {
      max-width: 560px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(48px, 8vw, 96px);
      line-height: 0.88;
      letter-spacing: -0.07em;
      text-wrap: balance;
    }

    .lead {
      margin: 24px 0 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.48;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      min-height: 66px;
      padding: 0 30px;
      border-radius: 999px;
      color: #150d03;
      background: linear-gradient(180deg, #fff0a6, var(--paper));
      box-shadow: 0 18px 42px rgba(247, 201, 74, 0.25), inset 0 1px rgba(255,255,255,0.65);
      font-weight: 950;
      font-size: clamp(17px, 2vw, 22px);
      text-decoration: none;
    }

    .cta:hover { transform: translateY(-2px); }

    .note {
      margin: 18px 0 0;
      color: rgba(255, 247, 223, 0.46);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; text-align: center; }
      .copy { margin-inline: auto; }
      .lead { margin-inline: auto; }
      .book { transform: rotateY(-5deg) rotateZ(-1deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta:hover { transform: none; }
      .book { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="book-wrap" aria-label="Book cover">
      <div class="book">
        <p class="panic">DON'T<br />PANIC</p>
        <div class="glyph" aria-hidden="true"><span></span></div>
        <p class="future">ABOUT<br />THE FUTURE</p>
      </div>
    </section>

    <section class="copy">
      <p class="eyebrow">Hitchhiker's Guide to the Future</p>
      <h1>A big friendly guide.</h1>
      <p class="lead">
        AI for people who already use AI, but still need a human willing to look up the missing context and add it back into the conversation.
      </p>
      <a class="cta" href="https://github.com/leo-guinan/hitchhikers-guide-chat">Ask a hitchhiker for help</a>
      <p class="note">$42/month. One plan. Bring a towel.</p>
    </section>
  </main>
</body>
</html>
